name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（默认 v0.1.0）'
        required: false
        default: 'v0.1.0'

jobs:
  release:
    name: 构建并发布 ${{ matrix.platform }}
    permissions:
      contents: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # ⚠️ 必须全量历史（默认 depth=1 是浅克隆）：三个守卫测试要用
          # `git show <baseline>` / `git diff <baseline> HEAD` 对照基线提交
          # （loadpage-remote-fallback.test.js:212 的 54300fa 等）。
          # 浅克隆下基线提交不可解析 → execSync 抛错 → 单元测试挂。
          # 2026-10-17 实证：本 workflow 的四个 job 全部因此步失败（CI 的 quality job
          # 早已带 fetch-depth: 0，但本文件漏了）。与 ci.yml 的 quality job 保持同口径。
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: 安装前端依赖
        run: npm ci

      - name: 内容 Schema 校验
        run: npm run validate:content

      # 与 ci.yml 的 quality job 同口径：先产出搜索/题库产物，否则产物级测试会
      # `skipIf(!artifactsReady)` 静默跳过（在干净检出里等于从未执行）
      - name: 生成搜索/题库产物（供产物级测试）
        run: npm run build:index

      # TEMP-DIAG：Windows 侧测试时红时绿（#13/#15 红、#14 绿），抓日志定位。定位后还原。
      - name: 单元测试
        id: unit
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/unit.log" 2>&1
          echo "unit_exit=$?" >> "$GITHUB_OUTPUT"
          tail -40 "$RUNNER_TEMP/unit.log"
        continue-on-error: true

      - name: 回传单元测试日志
        if: always() && steps.unit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let log = '(无日志)'
            try { log = fs.readFileSync(process.env.RUNNER_TEMP + '/unit.log', 'utf8') } catch (e) { log = '读取失败: ' + e.message }
            const tail = log.length > 60000 ? log.slice(-60000) : log
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'unit-test-log-' + process.env.RUNNER_OS,
              head_sha: context.sha, status: 'completed', conclusion: 'neutral',
              output: { title: `单元测试日志（${process.env.RUNNER_OS}）`, summary: `exit=${{ steps.unit.outputs.unit_exit }}`, text: tail }
            })

      - name: 判定单元测试结果
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.unit.outputs.unit_exit }}" != "0" ]; then exit 1; fi

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: '单招学习打卡 v__VERSION__'
          releaseBody: '请查看下方 Release 说明（RELEASE_NOTES.md）获取完整更新内容。'
          releaseDraft: true
          prerelease: false

  android:
    name: 构建 Android APK
    permissions:
      contents: write
      checks: write
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 同 release job：守卫测试依赖 git 历史（浅克隆会挂）
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链（含 Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 该 action 默认 packages 为 'tools platform-tools'，而 Google 已从 SDK 仓库
          # 移除遗留的 tools 包，装它会报 Failed to find package 'tools' 直接失败。
          # 这里只装仍需的 platform-tools；其余组件由下一步 sdkmanager 显式安装。
          packages: 'platform-tools'

      - name: 安装 Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: 安装 Android SDK 组件
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 安装前端依赖
        run: npm ci

      - name: 内容 Schema 校验
        run: npm run validate:content

      # 同 ci.yml：先产出，否则产物级测试静默跳过
      - name: 生成搜索/题库产物（供产物级测试）
        run: npm run build:index

      - name: 单元测试
        run: npm test

      - name: 初始化 Android 工程
        run: npm run tauri:android:init

      - name: 配置 Android 签名
        id: signing
        shell: bash
        run: |
          set +e
          node scripts/setup-android-signing.mjs > /tmp/android-signing.log 2>&1
          echo "signing_exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/android-signing.log
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: 构建 Android APK
        id: andbuild
        shell: bash
        run: |
          set +e
          npm run tauri:android:build -- --apk > /tmp/android-build.log 2>&1
          echo "android_exit=$?" >> "$GITHUB_OUTPUT"
          tail -60 /tmp/android-build.log
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        continue-on-error: true

      # TEMP-DIAG：job logs 需 admin 权限取不到，把构建/签名日志写成 check-run 供无权限读取。定位后还原。
      - name: 回传 Android 构建日志
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const read = (p) => { try { return fs.readFileSync(p, 'utf8') } catch (e) { return '(读取失败: ' + e.message + ')' } }
            const signing = read('/tmp/android-signing.log')
            const build = read('/tmp/android-build.log')
            // 签名段放最前（构建日志很长，只留尾部，避免把签名顶出 60KB 上限）
            const buildTail = build.length > 4000 ? '…(前略)…\n' + build.slice(-4000) : build
            const text = `===== 签名（判断用的是正式 keystore 还是临时）=====\n${signing}\n\n===== 构建（尾部）=====\n${buildTail}`
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'android-build-log', head_sha: context.sha,
              status: 'completed', conclusion: 'neutral',
              output: { title: 'Android 签名 + 构建日志', summary: `signing=${{ steps.signing.outputs.signing_exit }} build=${{ steps.andbuild.outputs.android_exit }}`, text }
            })

      - name: 判定 Android 构建结果
        if: always()
        run: |
          if [ "${{ steps.andbuild.outputs.android_exit }}" != "0" ]; then
            echo "Android 构建失败，完整日志见 android-build-log check-run"
            exit 1
          fi

      - name: 上传 APK 到 Release
        if: steps.andbuild.outputs.android_exit == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "单招学习打卡 v${TAG#v}" --notes "请查看 RELEASE_NOTES.md 获取完整更新内容。"
          gh release upload "$TAG" src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk --clobber
