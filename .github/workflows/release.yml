name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（默认 v0.1.0）'
        required: false
        default: 'v0.1.0'

jobs:
  # 发布门禁：与 ci.yml 的 quality job 同口径（lint / 生产构建 / 三个内容校验脚本）。
  # 背景：此前 release 的 4 个 job 只跑 validate:content + npm test，**缺 lint 与
  # check:content-remote / check:dup / check:single**——同一个内容缺陷，日常 CI 会红、
  # 发版时却能出包（QA R5）。现统一由本 job 把关，4 个构建 job 改为 needs: [gate]
  # 且不再重复跑校验（gate 通过才轮到构建）。
  gate:
    name: 发布门禁（与 CI quality 同口径）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 全量历史：三个守卫测试要 git show/diff 对照基线（与 ci.yml quality 同口径）
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 内容 Schema 校验
        run: npm run validate:content

      - name: 代码规范检查
        run: npm run lint

      # 先产出搜索/题库产物，否则产物级测试会 skipIf(!artifactsReady) 静默跳过
      - name: 生成搜索/题库产物（供产物级测试）
        run: npm run build:index

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 内容快照自检
        run: npm run check:content-remote

      - name: 题库实质重复检测（含 --selftest）
        run: npm run check:dup

      - name: 单选题判分口径检测
        run: npm run check:single

  release:
    name: 构建并发布 ${{ matrix.platform }}
    permissions:
      contents: write
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # ⚠️ 必须全量历史（默认 depth=1 是浅克隆）：三个守卫测试要用
          # `git show <baseline>` / `git diff <baseline> HEAD` 对照基线提交
          # （loadpage-remote-fallback.test.js:212 的 54300fa 等）。
          # 浅克隆下基线提交不可解析 → execSync 抛错 → 单元测试挂。
          # 2026-10-17 实证：本 workflow 的四个 job 全部因此步失败（CI 的 quality job
          # 早已带 fetch-depth: 0，但本文件漏了）。与 ci.yml 的 quality job 保持同口径。
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: 安装前端依赖
        run: npm ci

      # 校验（validate:content / lint / 单元测试 / 三个内容校验脚本 / 生产构建）
      # 已由 gate job 统一把关；本 job 只负责构建与发布，不再重复跑。
      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: '单招学习打卡 v__VERSION__'
          releaseBody: '请查看下方 Release 说明（RELEASE_NOTES.md）获取完整更新内容。'
          releaseDraft: true
          prerelease: false

  android:
    name: 构建 Android APK
    permissions:
      contents: write
    needs: [gate]
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 同 release job：守卫测试依赖 git 历史（浅克隆会挂）
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust 工具链（含 Android 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 该 action 默认 packages 为 'tools platform-tools'，而 Google 已从 SDK 仓库
          # 移除遗留的 tools 包，装它会报 Failed to find package 'tools' 直接失败。
          # 这里只装仍需的 platform-tools；其余组件由下一步 sdkmanager 显式安装。
          packages: 'platform-tools'

      - name: 安装 Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: 安装 Android SDK 组件
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 安装前端依赖
        run: npm ci

      # 校验已由 gate job 统一把关；本 job 只负责 Android 构建与签名，不再重复跑。
      - name: 初始化 Android 工程
        run: npm run tauri:android:init

      - name: 配置 Android 签名
        run: node scripts/setup-android-signing.mjs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: 构建 Android APK
        run: npm run tauri:android:build -- --apk
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 上传 APK 到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "单招学习打卡 v${TAG#v}" --notes "请查看 RELEASE_NOTES.md 获取完整更新内容。"
          gh release upload "$TAG" src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk --clobber
