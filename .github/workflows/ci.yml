name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: 校验 · 测试 · 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # ⚠️ 必须全量历史（默认 fetch-depth: 1 会浅克隆）：两个守卫测试用
          # `git diff <baseline> HEAD` / `git show <baseline>:file` 对照基线提交
          # （tests/loadpage-remote-fallback.test.js 的 54300fa、s2-verify-boundaries.test.js）。
          # 浅克隆下旧提交不可解析 → execSync 抛错 → 单元测试挂 → **整条自动部署链被跳过**。
          # 2026-10-15 定位：近 30 次 CI 全红皆因于此（本机全量克隆复现不出，故长期漏看）。
          # 移除本行前先确认那些测试已改为不依赖 git 历史。
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 内容 Schema 校验
        run: npm run validate:content

      - name: 代码规范检查
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

      # 远程内容快照自检（S4-4b，具名步骤）：读 dist 之外的本地产物 public/content-remote/，
      # 断言清单不变量（schemaVersion / contentVersion / units 与分片数一致 / sitePatch 恒空 /
      # S5+ 预留键为 null）+ 清单声明的分片逐个存在。产物缺失或形态坏 → **退出码 1**。
      # 为什么必须显式挂：build 经 prebuild 触发是**隐式**的，链子被改坏时构建可能仍通过而产物缺失。
      - name: 内容快照自检
        run: npm run check:content-remote

      # 以下两步读 public/practice-bank/{subject}.json（由 build:practice 产出）→ 必须放在「生产构建」之后：
      # build 经 prebuild → build:index → build:practice && build:search 已产出题库产物，此时数据就绪。
      # 阻断口径：check:dup 的 L1/L2 命中 → 退出码 1；check:single 的 A 类命中 → 退出码 1；两者 L3/B 类仅报告不阻断。
      - name: 题库实质重复检测
        run: npm run check:dup

      - name: 单选题判分口径检测
        run: npm run check:single

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  tauri-check:
    name: Rust 编译检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # 缓存 Cargo 依赖与编译产物，避免每次冷编译（Tauri 依赖树大，冷编译可达数小时）
      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-cargo-${{ runner.os }}-

      - name: Rust 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml

  server:
    name: 后端 校验 · 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        working-directory: server
        run: npm ci

      # server/ 是独立工作区（非 npm workspace），根目录 lint 覆盖不到，需单独跑
      - name: 代码规范检查
        working-directory: server
        run: npm run lint

      - name: 单元测试
        working-directory: server
        run: npm test

  deploy:
    name: 部署到线上服务器（rsync）
    # 仅在 push 到 main（非 PR）时部署；复用 quality 的构建产物
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: 配置 SSH 密钥
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: rsync 同步到服务器
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # 首次连接自动接受 host key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # BatchMode=yes：禁止交互提示，私钥认证失败立即报错而非挂起等待
          SSH_ARGS="-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes"
          # 零停机部署：先传 assets 与 vendor（新旧 hash 文件共存），最后切换 index.html
          # 第 1 步：上传 assets + vendor（含 GeoGebra 自托管资源），不删旧文件，期间旧页面仍可正常访问
          rsync -avz -e "ssh $SSH_ARGS" ./dist/assets/ "$USER@$HOST:/var/www/danzhao-study/assets/"
          rsync -avz -e "ssh $SSH_ARGS" ./dist/vendor/ "$USER@$HOST:/var/www/danzhao-study/vendor/"
          # 第 2 步：切换 index.html + 站点图标 + 搜索索引（两级：小 meta + 按学科正文分片，指向新资源，无 404 窗口）
          rsync -avz -e "ssh $SSH_ARGS" ./dist/index.html ./dist/favicon.ico ./dist/search-meta.json "$USER@$HOST:/var/www/danzhao-study/"
          rsync -avz -e "ssh $SSH_ARGS" ./dist/search-body/ "$USER@$HOST:/var/www/danzhao-study/search-body/"
          # 第 3 步：清理已被新版本替换的旧 assets / vendor / 正文分片，避免累积占用磁盘
          rsync -avz --delete -e "ssh $SSH_ARGS" ./dist/assets/ "$USER@$HOST:/var/www/danzhao-study/assets/"
          rsync -avz --delete -e "ssh $SSH_ARGS" ./dist/vendor/ "$USER@$HOST:/var/www/danzhao-study/vendor/"
          rsync -avz --delete -e "ssh $SSH_ARGS" ./dist/search-body/ "$USER@$HOST:/var/www/danzhao-study/search-body/"
          # 第 4 步：远程内容快照（**S4-4a 闭环修复**：此前 rsync 清单里没有它，
          #   导致一条 git push 的自动部署**不会**发布远程内容 → 网页端远程更新静默失效）
          #   顺序纪律：**先分片、后清单** —— manifest 是客户端的入口指针，最后切它才能保证
          #   任何时刻线上 manifest 指向的分片都已就位（与「最后切 index.html」同款）。
          #   不带 --delete：单元下线时旧分片残留无害（客户端只按 manifest 指向拉取），
          #   而 --delete 会在「新清单已上线、仍有旧客户端在飞」的窗口里删掉它们正在请求的文件。
          rsync -avz --exclude manifest.json -e "ssh $SSH_ARGS" ./dist/content-remote/ "$USER@$HOST:/var/www/danzhao-study/content-remote/"
          rsync -avz -e "ssh $SSH_ARGS" ./dist/content-remote/manifest.json "$USER@$HOST:/var/www/danzhao-study/content-remote/manifest.json"
          # 第 5 步：练习题库产物（同批补齐线上缺口；同样不带 --delete，理由同上）
          rsync -avz -e "ssh $SSH_ARGS" ./dist/practice-bank/ "$USER@$HOST:/var/www/danzhao-study/practice-bank/"

      - name: 部署后验证
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # 顺带清掉旧版单文件索引（阶段 7.4 已下线，留着只是占 241 KB 磁盘）
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes "$USER@$HOST" "rm -f /var/www/danzhao-study/search-index.json; sudo systemctl reload nginx || true; curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1/"
          # 远程内容快照：**必须**在服务器本地探到 manifest 且是 JSON（不是 SPA 兜底的 text/html）。
          # 缺失/类型不对 → 部署视为失败，避免重现「网页端远程静默失效」（S4-4a 口径）。
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes "$USER@$HOST" \
            "test -f /var/www/danzhao-study/content-remote/manifest.json || { echo '✗ 线上缺 content-remote/manifest.json'; exit 1; }"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -o BatchMode=yes "$USER@$HOST" \
            "curl -s -o /dev/null -w 'manifest HTTP %{http_code} type %{content_type}\n' http://127.0.0.1/content-remote/manifest.json | grep -q 'HTTP 200 type application/json' || { echo '✗ 线上 manifest 不可按 application/json 取到（可能落进 SPA 兜底）'; exit 1; }"

  deploy-backend:
    name: 部署后端到服务器
    # 仅在 push 到 main（非 PR）时部署；复用 server 的校验结果
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH 密钥
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 运行一键部署脚本
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: bash scripts/deploy-backend.sh
